[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-interpreter"
version = "0.1.0"
description = "macOS 按句中文到英文语音翻译 MVP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "dashscope>=1.25,<2",
    "numpy>=2.0,<3",
    "PySide6>=6.8,<7",
    "python-dotenv>=1.0,<2",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
ai-voice-interpreter = "ai_voice_interpreter.main:main"
ai-voice-enrollment = "ai_voice_interpreter.voice_enrollment:main"
ai-voice-doctor = "ai_voice_interpreter.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
