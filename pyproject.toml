[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-interpreter"
version = "0.4.0"
description = "macOS LiveTranslate 双向会议语音桥接 MVP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "certifi>=2025.1.31",
    "dashscope>=1.26.4,<2",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "PySide6>=6.8,<7",
    "python-dotenv>=1.0,<2",
    "python-socks>=2.7,<3",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
    "soxr>=1.0,<2",
    "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "webrtcvad-wheels>=2.0.14,<3",
]

[project.scripts]
ai-voice-interpreter = "ai_voice_interpreter.main:main"
ai-voice-enrollment = "ai_voice_interpreter.voice_enrollment:main"
ai-voice-doctor = "ai_voice_interpreter.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "server/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
