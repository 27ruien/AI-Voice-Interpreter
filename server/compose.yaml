name: ai-voice-interpreter

services:
  gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: ai-voice-interpreter-gateway
    env_file:
      - .env
    ports:
      - "127.0.0.1:8100:8000"
    restart: unless-stopped
    volumes:
      - interpreter-temp:/tmp/ai-voice-interpreter
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  interpreter-temp:
